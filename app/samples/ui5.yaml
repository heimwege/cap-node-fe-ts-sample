specVersion: '4.0'
metadata:
  name: com.sap.cap.fe.ts.sample
  allowSapInternal: true
type: application
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: false
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    - name: preview-middleware
      afterMiddleware: compression
      configuration:
        flp:
          path: localService/index.html
          intent:
            object: "Samples"
            action: "display"
        debug: false
    - name: sap-fe-mockserver
      mountPath: /
      beforeMiddleware: csp
      configuration:
        debug: false
        services:
          - urlPath: '/odata/v4/CapFeTsSampleService'
            metadataPath: './webapp/localService/metadata.xml'
            mockdataPath: './webapp/localService/mockdata'
    - name: fiori-tools-proxy
      afterMiddleware: sap-fe-mockserver
      configuration:
        ignoreCertError: true # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          paths:
            - path: /resources
              url: https://sapui5.hana.ondemand.com/
            - path: /test-resources
              url: https://sapui5.hana.ondemand.com/
          version: 1.132.0 # The UI5 version, for instance, 1.78.1. Empty means minUI5Version from manifest.json is used
